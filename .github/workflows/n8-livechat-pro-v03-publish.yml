name: Publish N8 LiveChat Pro v0.3

on:
  push:
    branches:
      - feature/n8-livechat-pro-v0.3
    paths:
      - 'dist/v03-payload/publish'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.3 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Reconstruct and verify release
        run: |
          cat \
            dist/v03-payload/part00 \
            dist/v03-payload/part01 \
            dist/v03-payload/part02 \
            dist/v03-payload/part03 \
            dist/v03-payload/part04 \
            dist/v03-payload/part05 \
            dist/v03-payload/part06 \
            dist/v03-payload/part07 \
            dist/v03-payload/part08 \
            dist/v03-payload/part09a \
            dist/v03-payload/part09b \
            dist/v03-payload/part10a \
            dist/v03-payload/part10b \
            dist/v03-payload/part11 \
            | base64 --decode > /tmp/n8-livechat-pro-0.3.0.zip
          echo '32fa3b21d4f8afffbe4af221f7035ea7b5e04b2ded9dbd0d87de8d142c343fec  /tmp/n8-livechat-pro-0.3.0.zip' | sha256sum -c -
          unzip -t /tmp/n8-livechat-pro-0.3.0.zip

      - name: Expand exact source
        run: |
          rm -rf /tmp/n8lc-v03 n8-livechat-pro
          mkdir -p /tmp/n8lc-v03
          unzip -q /tmp/n8-livechat-pro-0.3.0.zip -d /tmp/n8lc-v03
          test -f /tmp/n8lc-v03/n8-livechat-pro/n8-livechat-pro.php
          cp -a /tmp/n8lc-v03/n8-livechat-pro ./n8-livechat-pro

      - name: Validate PHP and JavaScript
        run: |
          find n8-livechat-pro -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find n8-livechat-pro/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          grep -F 'Version:     0.3.0' n8-livechat-pro/n8-livechat-pro.php

      - name: Publish source and installable ZIP
        run: |
          mkdir -p dist
          cp /tmp/n8-livechat-pro-0.3.0.zip dist/n8-livechat-pro-0.3.0.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r dist/v03-payload
          git add n8-livechat-pro dist/n8-livechat-pro-0.3.0.zip
          git commit -m 'Publish N8 LiveChat Pro 0.3.0 source and ZIP'
          git push
