name: Publish N8 LiveChat Pro v0.4

on:
  push:
    branches:
      - feature/n8-livechat-pro-v0.4
    paths:
      - 'dist/v04-payload/publish'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify delta
        run: |
          cat \
            dist/v04-payload/part00 \
            dist/v04-payload/part01 \
            dist/v04-payload/part02 \
            dist/v04-payload/part03 \
            dist/v04-payload/part04a \
            dist/v04-payload/part04b \
            dist/v04-payload/part05 \
            dist/v04-payload/part06 \
            dist/v04-payload/part07a \
            dist/v04-payload/part07b \
            dist/v04-payload/part08a \
            dist/v04-payload/part08b \
            | base64 --decode > /tmp/n8-livechat-pro-0.4.0-delta.tar.gz
          echo '832df5e901e5ac3c3932702c346ccb6ae8d820c6edd9259bf1999e42eec64111  /tmp/n8-livechat-pro-0.4.0-delta.tar.gz' | sha256sum -c -
          tar -tzf /tmp/n8-livechat-pro-0.4.0-delta.tar.gz

      - name: Apply exact v0.4 delta
        run: |
          tar -xzf /tmp/n8-livechat-pro-0.4.0-delta.tar.gz -C "$GITHUB_WORKSPACE"
          test -f n8-livechat-pro/includes/class-n8lc-platform.php
          test -f n8-livechat-pro/includes/class-n8lc-privacy.php
          test -f n8-livechat-pro/includes/class-n8lc-knowledge.php
          grep -F 'Version:     0.4.0' n8-livechat-pro/n8-livechat-pro.php
          grep -F 'Stable tag: 0.4.0' n8-livechat-pro/readme.txt
          grep -F 'Tested up to: 7.0' n8-livechat-pro/readme.txt

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP 7.4 syntax gate
        run: find n8-livechat-pro -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: PHP 8.4 syntax gate
        run: find n8-livechat-pro -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript and security static gates
        run: |
          find n8-livechat-pro/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          ! grep -RIn --include='*.php' 'onclick=' n8-livechat-pro
          grep -F 'wp_privacy_personal_data_exporters' n8-livechat-pro/includes/class-n8lc-privacy.php
          grep -F 'wp_privacy_personal_data_erasers' n8-livechat-pro/includes/class-n8lc-privacy.php
          grep -F 'permission_callback' n8-livechat-pro/includes/class-n8lc-platform.php
          grep -F "'https'" n8-livechat-pro/includes/class-n8lc-platform.php

      - name: Build installable release ZIP
        run: |
          rm -f dist/n8-livechat-pro-0.4.0.zip dist/n8-livechat-pro-0.4.0.sha256
          zip -qr dist/n8-livechat-pro-0.4.0.zip n8-livechat-pro -x '*/.DS_Store'
          sha256sum dist/n8-livechat-pro-0.4.0.zip > dist/n8-livechat-pro-0.4.0.sha256
          unzip -t dist/n8-livechat-pro-0.4.0.zip

      - name: Publish source and release package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r dist/v04-payload
          git add n8-livechat-pro dist/n8-livechat-pro-0.4.0.zip dist/n8-livechat-pro-0.4.0.sha256
          git commit -m 'Publish N8 LiveChat Pro 0.4.0 professional platform'
          git push
