name: Direct installable package

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/direct-installable-package.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installable RevertShield ZIP
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build plugin package
        run: |
          chmod +x ./bin/build-release.sh
          ./bin/build-release.sh ./revertshield.zip
          sha256sum ./revertshield.zip > ./revertshield.zip.sha256

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: revertshield-installable
          path: |
            revertshield.zip
            revertshield.zip.sha256
          if-no-files-found: error
          retention-days: 1
