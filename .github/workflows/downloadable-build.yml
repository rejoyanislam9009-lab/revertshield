name: Downloadable plugin build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build installable ZIP
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build WordPress plugin ZIP
        run: |
          chmod +x ./bin/build-release.sh
          ./bin/build-release.sh ./revertshield.zip
          sha256sum ./revertshield.zip > ./revertshield.zip.sha256

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: revertshield-${{ github.ref_name }}
          path: |
            revertshield.zip
            revertshield.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: revertshield-${{ github.ref_name }}
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/revertshield.zip#RevertShield WordPress plugin" \
            "release/revertshield.zip.sha256#SHA-256 checksum" \
            --title "RevertShield ${GITHUB_REF_NAME}" \
            --generate-notes
