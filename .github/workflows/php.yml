name: Plugin quality gates

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: revertshield-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run PHPCS
        run: vendor/bin/phpcs

  runtime-smoke:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }} runtime smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            php: '7.4'
          - wordpress: 'latest'
            php: '8.4'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli
      - name: Build installable plugin
        run: |
          chmod +x ./bin/build-release.sh
          ./bin/build-release.sh /tmp/revertshield.zip
      - name: Install WordPress
        run: |
          mkdir -p /tmp/revertshield-wp
          wp core download --path=/tmp/revertshield-wp --version="${{ matrix.wordpress }}" --force
          wp config create --path=/tmp/revertshield-wp --dbname=revertshield_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp db create --path=/tmp/revertshield-wp
          wp core install --path=/tmp/revertshield-wp --url=http://revertshield.test --title="RevertShield Test" --admin_user=admin --admin_password=test-password --admin_email=test@example.com --skip-email
      - name: Install and activate RevertShield
        run: |
          unzip -q /tmp/revertshield.zip -d /tmp/revertshield-wp/wp-content/plugins
          wp plugin activate revertshield --path=/tmp/revertshield-wp
      - name: Run runtime smoke assertions
        run: wp eval-file "$GITHUB_WORKSPACE/tests/runtime-smoke.php" --path=/tmp/revertshield-wp
      - name: Run snapshot, update, recovery regression assertions
        run: wp eval-file "$GITHUB_WORKSPACE/tests/runtime-regression.php" --path=/tmp/revertshield-wp
      - name: Run WooCommerce health-adapter regression assertions
        run: wp eval-file "$GITHUB_WORKSPACE/tests/runtime-woocommerce.php" --path=/tmp/revertshield-wp
      - name: Install and activate real WooCommerce on latest boundary
        if: matrix.wordpress == 'latest'
        run: wp plugin install woocommerce --activate --path=/tmp/revertshield-wp
      - name: Run live WooCommerce Store API integration assertions
        if: matrix.wordpress == 'latest'
        run: wp eval-file "$GITHUB_WORKSPACE/tests/runtime-woocommerce-live.php" --path=/tmp/revertshield-wp

  multisite-runtime:
    name: WordPress latest / PHP 8.4 Multisite safety
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: wp-cli
      - name: Build installable plugin
        run: |
          chmod +x ./bin/build-release.sh
          ./bin/build-release.sh /tmp/revertshield.zip
      - name: Install WordPress Multisite
        run: |
          mkdir -p /tmp/revertshield-ms
          wp core download --path=/tmp/revertshield-ms --version=latest --force
          wp config create --path=/tmp/revertshield-ms --dbname=revertshield_ms_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp db create --path=/tmp/revertshield-ms
          wp core multisite-install --path=/tmp/revertshield-ms --url=http://revertshield.test --title="RevertShield Multisite Test" --admin_user=admin --admin_password=test-password --admin_email=test@example.com --skip-email
      - name: Install and network-activate RevertShield
        run: |
          unzip -q /tmp/revertshield.zip -d /tmp/revertshield-ms/wp-content/plugins
          wp plugin activate revertshield --network --path=/tmp/revertshield-ms
      - name: Create secondary site
        run: wp site create --slug=second --title="RevertShield Second Site" --email=test@example.com --path=/tmp/revertshield-ms
      - name: Run Multisite safety assertions
        run: wp eval-file "$GITHUB_WORKSPACE/tests/runtime-multisite.php" --path=/tmp/revertshield-ms

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build release artifact
        run: |
          chmod +x ./bin/build-release.sh
          ./bin/build-release.sh ./revertshield.zip
          mkdir -p ./tmp-build
          unzip -q ./revertshield.zip -d ./tmp-build
      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './tmp-build/revertshield'
          slug: 'revertshield'
          strict: true
