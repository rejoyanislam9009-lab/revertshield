name: Plugin quality gates

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run PHPCS
        run: vendor/bin/phpcs

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build release artifact
        run: |
          chmod +x ./bin/build-release.sh
          ./bin/build-release.sh ./revertshield.zip
          mkdir -p ./tmp-build
          unzip -q ./revertshield.zip -d ./tmp-build
      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './tmp-build/revertshield'
          slug: 'revertshield'
          exclude-checks: 'plugin_review_phpcs'
          strict: true
