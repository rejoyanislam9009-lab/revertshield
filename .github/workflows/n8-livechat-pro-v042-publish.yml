name: N8 LiveChat Pro v0.4.2 Admin Runtime Fix

on:
  push:
    branches:
      - feature/n8-livechat-pro-v0.4.2
    paths:
      - 'dist/v042-admin-runtime-fix.patch'
      - '.github/workflows/n8-livechat-pro-v042-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.4.2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply admin runtime hotfix
        run: |
          patch -p1 --forward < dist/v042-admin-runtime-fix.patch

      - name: Verify WordPress user object regression fix
        run: |
          grep -F 'Version:     0.4.2' n8-livechat-pro/n8-livechat-pro.php
          grep -F "define( 'N8LC_VERSION', '0.4.2' );" n8-livechat-pro/n8-livechat-pro.php
          grep -F 'Stable tag: 0.4.2' n8-livechat-pro/readme.txt
          grep -F "get_users( array( 'fields' => 'all' ) )" n8-livechat-pro/includes/class-n8lc-admin.php
          grep -F "get_users( array( 'fields' => 'all' ) )" n8-livechat-pro/includes/class-n8lc-platform.php
          grep -F 'instanceof WP_User' n8-livechat-pro/includes/class-n8lc-admin.php
          grep -F 'instanceof WP_User' n8-livechat-pro/includes/class-n8lc-platform.php
          ! grep -F "get_users( array( 'fields' => array( 'ID', 'display_name', 'user_email' ) ) )" n8-livechat-pro/includes/class-n8lc-admin.php
          ! grep -F "get_users( array( 'fields' => array( 'ID', 'display_name', 'user_email', 'roles' ) ) )" n8-livechat-pro/includes/class-n8lc-platform.php

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP 7.4 syntax gate
        run: find n8-livechat-pro -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: PHP 8.4 syntax gate
        run: find n8-livechat-pro -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax gate
        run: find n8-livechat-pro/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build and verify installable ZIP
        run: |
          rm -f dist/n8-livechat-pro-0.4.2.zip dist/n8-livechat-pro-0.4.2.sha256
          zip -qr dist/n8-livechat-pro-0.4.2.zip n8-livechat-pro -x '*/.DS_Store'
          sha256sum dist/n8-livechat-pro-0.4.2.zip > dist/n8-livechat-pro-0.4.2.sha256
          unzip -t dist/n8-livechat-pro-0.4.2.zip

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8-livechat-pro-0.4.2
          path: |
            dist/n8-livechat-pro-0.4.2.zip
            dist/n8-livechat-pro-0.4.2.sha256
          if-no-files-found: error

      - name: Publish fixed source and package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm dist/v042-admin-runtime-fix.patch
          git add n8-livechat-pro dist/n8-livechat-pro-0.4.2.zip dist/n8-livechat-pro-0.4.2.sha256
          git commit -m 'Publish N8 LiveChat Pro 0.4.2 admin runtime fix'
          git push
