name: N8 LiveChat Pro v0.4.2 Admin Runtime Fix

on:
  push:
    branches:
      - feature/n8-livechat-pro-v0.4.2
    paths:
      - 'dist/v042-admin-runtime-fix.patch'
      - '.github/workflows/n8-livechat-pro-v042-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.4.2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact admin runtime hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'n8-livechat-pro/includes/class-n8lc-admin.php',
              "        foreach ( get_users( array( 'fields' => array( 'ID', 'display_name', 'user_email' ) ) ) as $user ) {\n            if ( user_can( $user, 'n8lc_reply_chat' ) || user_can( $user, 'manage_options' ) ) {",
              "        foreach ( get_users( array( 'fields' => 'all' ) ) as $user ) {\n            if ( ! ( $user instanceof WP_User ) ) {\n                continue;\n            }\n            if ( user_can( $user, 'n8lc_reply_chat' ) || user_can( $user, 'manage_options' ) ) {",
          )

          replace_once(
              'n8-livechat-pro/includes/class-n8lc-platform.php',
              "        $users = get_users( array( 'fields' => array( 'ID', 'display_name', 'user_email', 'roles' ) ) );\n        $items = array();\n        $can_onboard = current_user_can( 'manage_options' );\n        foreach ( $users as $user ) {",
              "        $users = get_users( array( 'fields' => 'all' ) );\n        $items = array();\n        $can_onboard = current_user_can( 'manage_options' );\n        foreach ( $users as $user ) {\n            if ( ! ( $user instanceof WP_User ) ) {\n                continue;\n            }",
          )

          replace_once('n8-livechat-pro/n8-livechat-pro.php', ' * Version:     0.4.1', ' * Version:     0.4.2')
          replace_once("n8-livechat-pro/n8-livechat-pro.php", "define( 'N8LC_VERSION', '0.4.1' );", "define( 'N8LC_VERSION', '0.4.2' );")
          replace_once('n8-livechat-pro/readme.txt', 'Stable tag: 0.4.1', 'Stable tag: 0.4.2')
          replace_once('n8-livechat-pro/README.md', '# N8 LiveChat Pro 0.4.1', '# N8 LiveChat Pro 0.4.2')
          replace_once('n8-livechat-pro/README.md', 'Version 0.4.1 preserves', 'Version 0.4.2 preserves')
          replace_once('n8-livechat-pro/README.md', 'n8-livechat-pro-0.4.1.zip', 'n8-livechat-pro-0.4.2.zip')

          readme = Path('n8-livechat-pro/readme.txt')
          text = readme.read_text()
          marker = '== Changelog ==\n'
          entry = "= 0.4.2 =\n* Fixed a WordPress admin fatal caused by passing partial stdClass user-query rows into user_can().\n* LiveChat dashboard, inbox, settings, team and platform pages now request full WP_User objects before capability checks.\n* Added an admin-runtime regression gate to prevent this capability-check crash from returning.\n\n"
          if '= 0.4.2 =' not in text:
              if marker not in text:
                  raise SystemExit('readme changelog marker missing')
              readme.write_text(text.replace(marker, marker + entry, 1))
          PY

      - name: Verify WordPress user object regression fix
        run: |
          grep -F 'Version:     0.4.2' n8-livechat-pro/n8-livechat-pro.php
          grep -F "define( 'N8LC_VERSION', '0.4.2' );" n8-livechat-pro/n8-livechat-pro.php
          grep -F 'Stable tag: 0.4.2' n8-livechat-pro/readme.txt
          grep -F "get_users( array( 'fields' => 'all' ) )" n8-livechat-pro/includes/class-n8lc-admin.php
          grep -F "get_users( array( 'fields' => 'all' ) )" n8-livechat-pro/includes/class-n8lc-platform.php
          grep -F 'instanceof WP_User' n8-livechat-pro/includes/class-n8lc-admin.php
          grep -F 'instanceof WP_User' n8-livechat-pro/includes/class-n8lc-platform.php
          ! grep -F "get_users( array( 'fields' => array( 'ID', 'display_name', 'user_email' ) ) )" n8-livechat-pro/includes/class-n8lc-admin.php
          ! grep -F "get_users( array( 'fields' => array( 'ID', 'display_name', 'user_email', 'roles' ) ) )" n8-livechat-pro/includes/class-n8lc-platform.php

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP 7.4 syntax gate
        run: find n8-livechat-pro -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: PHP 8.4 syntax gate
        run: find n8-livechat-pro -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax gate
        run: find n8-livechat-pro/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build and verify installable ZIP
        run: |
          rm -f dist/n8-livechat-pro-0.4.2.zip dist/n8-livechat-pro-0.4.2.sha256
          zip -qr dist/n8-livechat-pro-0.4.2.zip n8-livechat-pro -x '*/.DS_Store'
          sha256sum dist/n8-livechat-pro-0.4.2.zip > dist/n8-livechat-pro-0.4.2.sha256
          unzip -t dist/n8-livechat-pro-0.4.2.zip

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8-livechat-pro-0.4.2
          path: |
            dist/n8-livechat-pro-0.4.2.zip
            dist/n8-livechat-pro-0.4.2.sha256
          if-no-files-found: error

      - name: Publish fixed source and package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm dist/v042-admin-runtime-fix.patch
          git add n8-livechat-pro dist/n8-livechat-pro-0.4.2.zip dist/n8-livechat-pro-0.4.2.sha256
          git commit -m 'Publish N8 LiveChat Pro 0.4.2 admin runtime fix'
          git push
